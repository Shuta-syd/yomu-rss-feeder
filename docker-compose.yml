x-yomu-env: &yomu-env
  NODE_ENV: production
  DATABASE_PATH: /data/yomu.db
  DATABASE_URL: file:/data/yomu.db
  TZ: Asia/Tokyo
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  ALLOW_PRIVATE_FEED_URLS: ${ALLOW_PRIVATE_FEED_URLS:-}
  ALLOWED_DEV_ORIGINS: ${ALLOWED_DEV_ORIGINS:-}
  YOMU_SYNC_MAX_DURATION_MS: ${YOMU_SYNC_MAX_DURATION_MS:-480000}
  YOMU_SYNC_LOCK_TIMEOUT_MS: ${YOMU_SYNC_LOCK_TIMEOUT_MS:-600000}
  YOMU_MAX_FEED_ITEMS: ${YOMU_MAX_FEED_ITEMS:-200}
  YOMU_MAX_FULL_CONTENT_FETCHES_PER_FEED: ${YOMU_MAX_FULL_CONTENT_FETCHES_PER_FEED:-20}
  YOMU_MAX_ITEM_HTML_CHARS: ${YOMU_MAX_ITEM_HTML_CHARS:-200000}
  YOMU_STAGE1_PENDING_LIMIT: ${YOMU_STAGE1_PENDING_LIMIT:-50}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: yomu:latest
    restart: unless-stopped
    ports:
      - "3300:3000"
    volumes:
      - yomu-data:/data
    environment:
      <<: *yomu-env
      YOMU_AUTO_SYNC_ENABLED: "false"
      YOMU_RUN_MIGRATIONS: "true"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    image: yomu:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - yomu-data:/data
    environment:
      <<: *yomu-env
      YOMU_AUTO_SYNC_ENABLED: ${YOMU_AUTO_SYNC_ENABLED:-true}
      YOMU_RUN_MIGRATIONS: "false"
    command: ["node", "dist/scripts/worker.js"]

volumes:
  yomu-data:
